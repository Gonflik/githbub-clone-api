[project]
name = "githbub-clone-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "coverage>=7.15.4",
    "django>=6.0.7",
    "django-extensions>=4.1",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-nested-routers>=0.95.3",
    "psycopg>=3.3.4",
    "pytest>=9.1.1",
    "pytest-django>=4.13.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
markers = [
    "accounts: marks tests that test accounts app",
    "repositories: marks tests that test repo app",
    "issues: marks tests that test issues app",
    "comments: marks test that test comments in issues app",
    "collaborators: marks test that test collaborators stuff in repo app",
    "invitations: marks test that test invites in invitations app",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*apps.py",
    "*migrations*",
    "*settings*",
    "*urls.py",
    "manage.py",
    "wsgi.py",
    "asgi.py",
]

[tool.coverage.report]
show_missing = true